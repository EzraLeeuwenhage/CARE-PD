model:
  name: "Joint-MLP-Baseline-3D"
  is_joint_model: true
  hidden_dim: 1024
  class_embed_dim: 64
  time_embed_dim: 64
  num_classes: 4

data:
  representation: "3D"
  num_joints: 24
  smpl_path: "thesis/data/raw/PD-GaM/3D_SMPL/PD-GaM_3D_SMPL_rot_trans_canonical.npz"
  patient_prefix: "all"
  severity_labels_path: "thesis/data/metadata/pd_gam_labels.json"

windowing:
  # sequence_type: "fixed"    # Master switch for future Masked/Variable length UNet
  total_window_size: 60
  prefix_length: 15
  step_size: 10
  min_z_travel: 0.5
  filter_z_travel: false

training:
  overfit_severity_class: -1
  overfit_seed: 42

  epochs: 150
  learning_rate: 0.001
  batch_size: 32
  shuffle: true

  eval_split: 0.1
  test_split: 0.2

  log_interval: 5
  val_interval: 10
  wandb_val_interval: 50   
  eval_batches: -1
  num_workers: 2

  loss_weight: 0.5
  lambda_motion: 1.0
  lambda_label: 1.0

sampling:
  num_steps: 20

paths:
  weights_dir: "thesis/data/checkpoints"
  output_dir: "thesis/data/processed/{model_name}"