model:
  name: "AR-SpatioTemporal-3D-(smaller)"
  generation_mode: "ar_rollout"       # Switch between "ar_rollout" and "one_shot"
  backbone_type: "spatiotemporal"     # Switch between "mlp" and "spatiotemporal"
  is_joint_model: false
  hidden_dim: 256
  num_heads: 8                        # number of attention heads for spatiotemporal backbone
  dilations: [1, 2, 4, 8, 16]         # receptive field dilations for spatiotemporal backbone - 63 frames
  class_embed_dim: 64
  time_embed_dim: 64
  num_classes: 4

data:
  representation: "3D"          # Switch between 6D and 3D SMPL for model input (also update smpl path)
  num_joints: 24                # for 3D, use 24, otherwise 25 joints
  smpl_path: "thesis/data/raw/PD-GaM/3D_SMPL/PD-GaM_3D_SMPL_rot_trans_canonical.npz"
  patient_prefix: "all"
  severity_labels_path: "thesis/data/metadata/pd_gam_labels.json"

windowing:
  total_window_size: 60
  prefix_length: 15
  step_size: 45

  max_sequence_len: 200         # Required for one_shot padding and full sequence testing
  full_seq_step_size: 100       # Define fullsequence train dataloader stride for window extraction
  min_z_travel: 0.5             # Used by H36MEvaluator to skip stationary sequences
  filter_z_travel: false        # Set to 'true' to filter stationary sequences from dataset

training:
  overfit_severity_class: -1    # Set to '-1' for standard training runs, or [0-3] to overfit
  overfit_seed: 42

  # Path to .ckpt file to continue from (or null to train from scratch)
  resume_checkpoint: "thesis/data/processed/AR-SpatioTemporal-3D-(smaller)/checkpoints/best-449-0.00.ckpt"        
  resume_trainer_state: true    # false: warm-start weights for N new epochs; true: restore optimizer & epoch count
  resume_wandb_id: "abc123xy"   # run id for wandb to resume logging to the same run (or null to start a new run) 

  prefix_noise_std: 0.05        # Used for AR exposure bias mitigation
  path_smoothing_noise: 0.0     # TODO: test with this stuff

  prior_noise_scale: 1.0        # Used for informed prior generation
  use_cumsum_prior: true        # Set to true to have prefix accumulate noise over time

  epochs: 4000
  learning_rate: 0.0003
  warmup_epochs: 30
  eta_min: 0.00003
  batch_size: 32
  shuffle: true

  eval_split: 0.1
  test_split: 0.2

  log_interval: 10
  val_interval: 50
  wandb_val_interval: 500   
  eval_batches: -1              # where '-1' means all batches in the validation set
  eval_batch_size: 32
  num_workers: 8

  alpha_trans: 0.50             # Mixing weight [0, 1] balancing translation vs. pose
  alpha_label: 0.50             # Mixing weight [0, 1] balancing CTMC label vs. motion    
  pose_loss_scale: 5.0          # TODO: test this stuff

sampling:
  num_steps: 20

paths:
  weights_dir: "thesis/data/checkpoints"
  output_dir: "thesis/data/processed/{model_name}"