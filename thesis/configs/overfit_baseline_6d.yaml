model:
  name: "Overfit-Joint-MLP-6D"
  is_joint_model: true
  hidden_dim: 1024
  class_embed_dim: 64
  time_embed_dim: 64
  num_classes: 4

data:
  representation: "6D"  # Switch between 6D and 3D SMPL for model input
  num_joints: 24
  smpl_path: "thesis/data/raw/PD-GaM/6D_SMPL/PD-GaM_6D_SMPL_rot_trans_canonical.npz"
  patient_prefix: "all"
  severity_labels_path: "thesis/data/metadata/pd_gam_labels.json"

windowing:
  # sequence_type: "fixed"    # Master switch for future Masked/Variable length UNet
  total_window_size: 60
  prefix_length: 15
  step_size: 10
  min_z_travel: 0.5           # Used by H36MEvaluator to skip stationary sequences
  filter_z_travel: true       # Set to 'true' to filter stationary sequences from dataset 

training:
  overfit_severity_class: 2   # If set to '-1', no overfitting mode. Else, overfit on random sample from class 'value'
  overfit_seed: 42

  epochs: 500
  learning_rate: 0.001
  batch_size: 512
  shuffle: true

  eval_split: 0.1
  test_split: 0.2

  log_interval: 25
  val_interval: 50
  wandb_val_interval: 250   
  eval_batches: -1        # where '-1' means all batches in the validation set
  num_workers: 2

  lambda_pose: 1.0        # Loss multiplier for the pose/joint reconstruction
  lambda_trans: 6.0       # Loss multiplier for the global translation/trajectory
  lambda_motion: 1.0      # (Joint Model) Loss multiplier for continuous motion vector field 
  lambda_label: 1.0       # (Joint Model) Loss multiplier for discrete CTMC jump rate matrix

sampling:
  num_steps: 20

paths:
  weights_dir: "thesis/data/checkpoints"
  output_dir: "thesis/data/processed/{model_name}"