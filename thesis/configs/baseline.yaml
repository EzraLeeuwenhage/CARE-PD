windowing:
  total_window_size: 60
  prefix_length: 15
  step_size: 10

data:
  num_joints: 24
  6d_smpl_path: "thesis/data/raw/PD-GaM/6D_SMPL/6D_SMPL_30f_or_longer.npz"
  smpl_translations_path: "thesis/data/raw/PD-GaM/6D_SMPL/6D_SMPL_30f_or_longer_translations.npz"
  patient_prefix: "all"
  severity_labels_path: "thesis/data/metadata/pd_gam_labels.json"

training:
  epochs: 500
  learning_rate: 0.001
  batch_size: 256
  num_workers: 2
  shuffle: true
  loss_weight: 0.5
  log_interval: 1

sampling:
  num_steps: 100

paths:
  weights: "thesis/models/baseline_model.pth"
  output_dir: "thesis/data/processed/baseline_model"