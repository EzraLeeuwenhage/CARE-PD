data:
  num_joints: 24
  6d_smpl_path: "thesis/data/raw/PD-GaM/6D_SMPL/PD-GaM_6D_SMPL_rot_trans_no_slope_no_veering.npz"
  patient_prefix: "all"
  severity_labels_path: "thesis/data/metadata/pd_gam_labels.json"

windowing:
  total_window_size: 60
  prefix_length: 15
  step_size: 10
  min_z_travel: 0.5

training:
  epochs: 5
  learning_rate: 0.001
  batch_size: 256
  num_workers: 2
  shuffle: true
  loss_weight: 0.5
  log_interval: 1

sampling:
  num_steps: 100

paths:
  weights: "thesis/models/baseline_model_v2.pth"
  output_dir: "thesis/data/processed/baseline_model_v2"